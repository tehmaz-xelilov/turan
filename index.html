<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Leather | Premium Dəri Məhsulları</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Main Styles (YENİ DİZAYN) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">TURAN <span>LEATHER</span></a>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Məhsul axtarın...">
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Əsl dəri.<br>Əsl <span class="gold">sənət</span>.</h1>
                <p class="hero-desc">Turan Leather — əl işi premium dəri aksesuarlar. Hər bir məhsul saatlarla zəhmət və diqqət məhsuludur.</p>
                <button id="exploreBtn" class="btn-primary">
                    <i class="fas fa-shopping-bag"></i> KOLLEKSİYANI KƏŞF ET
                </button>
            </div>
        </div>
    </section>

    <!-- Filters + Products Main Area -->
    <div class="filters-panel">
        <div class="container filters-row">
            <div class="category-filters" id="categoryFilters">
                <!-- Kateqoriyalar JS ilə dolacaq -->
            </div>
            <div class="price-range">
                <input type="number" id="minPrice" placeholder="Min ₼" step="1">
                <input type="number" id="maxPrice" placeholder="Max ₼" step="1">
                <button id="applyPriceBtn"><i class="fas fa-filter"></i></button>
                <button id="resetFiltersBtn" class="btn-outline" style="padding: 6px 16px;">Sıfırla</button>
            </div>
        </div>
    </div>

    <main class="container">
        <!-- Product count row -->
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
            <span id="productCountText" class="product-count">0 məhsul</span>
            <button id="mobileFilterToggle" class="btn-outline" style="display: none; padding: 6px 14px;">
                <i class="fas fa-sliders-h"></i> Filtrlər
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="spinner" style="display: none;"></div>

        <!-- Products Grid -->
        <div id="productsGrid" class="products-grid"></div>

        <!-- Load More Button -->
        <div id="loadMoreWrapper" class="load-more-wrap">
            <button id="loadMoreBtn" class="btn-outline">Daha çox <i class="fas fa-arrow-down"></i></button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p style="margin-bottom: 12px;">© 2025 Turan Leather — Premium əl işi dəri</p>
            <p style="font-size: 0.7rem;">Sifarişlər üçün WhatsApp: <span class="gold">+994 XX XXX XX XX</span></p>
        </div>
    </footer>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
            <div class="modal-grid">
                <div class="modal-slider">
                    <div class="swiper productSwiper">
                        <div class="swiper-wrapper" id="modalSwiperWrapper"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>
                <div class="modal-info">
                    <span id="modalCategory" class="product-category"></span>
                    <h2 id="modalProductName" style="font-size: 1.8rem; margin: 16px 0 8px;"></h2>
                    <div id="modalPrice" class="product-price" style="font-size: 2rem;"></div>
                    <p id="modalDescription" style="color: #B0AA9F; line-height: 1.6; margin: 20px 0;"></p>
                    <button id="modalOrderBtn" class="btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fab fa-whatsapp"></i> WhatsApp ilə sifariş et
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast mesajları -->
    <div id="toastMsg" class="toast-notify">
        <i class="fas fa-check-circle" style="color: #D4AF6A; margin-right: 8px;"></i>
        <span id="toastText"></span>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Mobil filtr toggle üçün əlavə
        const filterToggle = document.getElementById('mobileFilterToggle');
        const filtersPanel = document.querySelector('.filters-panel');
        if(filterToggle && filtersPanel) {
            filterToggle.style.display = window.innerWidth < 768 ? 'inline-flex' : 'none';
            filterToggle.addEventListener('click', () => {
                filtersPanel.classList.toggle('active');
                if(filtersPanel.classList.contains('active')) {
                    filtersPanel.style.display = 'block';
                } else {
                    filtersPanel.style.display = '';
                }
            });
            window.addEventListener('resize', () => {
                if(window.innerWidth < 768) filterToggle.style.display = 'inline-flex';
                else filterToggle.style.display = 'none';
            });
        }
    </script>
</body>
</html>
