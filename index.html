<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Leather - Premium Dəri Məhsulları</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Premium theme overrides (visual only) -->
    <link rel="stylesheet" href="premium.css">
</head>
<body class="bg-[#FAF8F5]">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#1A1814] text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-wider" style="font-family: 'Playfair Display', serif;">
                        TURAN <span class="text-[#C9A96E]">LEATHER</span>
                    </h1>
                </div>

                <!-- Desktop Search & Menu -->
                <div class="hidden md:flex items-center space-x-6 flex-1 max-w-lg mx-8">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Məhsul axtar..." 
                               class="w-full pl-10 pr-4 py-2 bg-[#2C2822] border border-[#3D3830] rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-[#C9A96E] transition-colors">
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobileMenuBtn" class="md:hidden text-white text-2xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Search -->
        <div class="md:hidden px-4 pb-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="mobileSearchInput" placeholder="Məhsul axtar..." 
                       class="w-full pl-10 pr-4 py-2 bg-[#2C2822] border border-[#3D3830] rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-[#C9A96E] transition-colors">
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Filters -->
            <aside id="filterSidebar" class="lg:w-72 flex-shrink-0 hidden lg:block">
                <div class="sticky top-24 bg-white rounded-xl shadow-sm p-6 border border-[#E5D9C5]">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-semibold text-[#1A1814]">Filtrlər</h2>
                        <button id="resetFilters" class="text-sm text-[#C9A96E] hover:text-[#A8894A] transition-colors">
                            <i class="fa-solid fa-rotate-left mr-1"></i> Sıfırla
                        </button>
                    </div>

                    <!-- Category Filter -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-[#5C5548] mb-3">Kateqoriya</h3>
                        <div id="categoryFilters" class="space-y-2">
                            <!-- Categories will be loaded dynamically -->
                        </div>
                    </div>

                    <!-- Price Range Filter -->
                    <div>
                        <h3 class="text-sm font-medium text-[#5C5548] mb-3">Qiymət Aralığı (₼)</h3>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="minPrice" placeholder="Min" 
                                   class="w-full px-3 py-2 border border-[#D4C5B2] rounded-lg text-sm focus:outline-none focus:border-[#C9A96E]">
                            <span class="text-[#5C5548]">-</span>
                            <input type="number" id="maxPrice" placeholder="Max" 
                                   class="w-full px-3 py-2 border border-[#D4C5B2] rounded-lg text-sm focus:outline-none focus:border-[#C9A96E]">
                        </div>
                        <button id="applyPriceFilter" class="w-full mt-3 px-4 py-2 bg-[#1A1814] text-white rounded-lg text-sm hover:bg-[#2C2822] transition-colors">
                            Tətbiq et
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Mobile Filter Overlay -->
            <div id="mobileFilterOverlay" class="fixed inset-0 bg-black/50 z-50 hidden lg:hidden">
                <div class="absolute right-0 top-0 h-full w-80 bg-white p-6 overflow-y-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-semibold">Filtrlər</h2>
                        <button id="closeMobileFilter" class="text-2xl text-gray-500">&times;</button>
                    </div>
                    <!-- Same filter content as desktop -->
                    <div id="mobileCategoryFilters" class="space-y-2 mb-6"></div>
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-[#5C5548] mb-3">Qiymət Aralığı (₼)</h3>
                        <div class="flex items-center space-x-2 mb-3">
                            <input type="number" id="mobileMinPrice" placeholder="Min" 
                                   class="w-full px-3 py-2 border rounded-lg text-sm">
                            <span>-</span>
                            <input type="number" id="mobileMaxPrice" placeholder="Max" 
                                   class="w-full px-3 py-2 border rounded-lg text-sm">
                        </div>
                        <button id="applyMobilePriceFilter" class="w-full px-4 py-2 bg-[#1A1814] text-white rounded-lg text-sm">
                            Tətbiq et
                        </button>
                    </div>
                    <button id="resetMobileFilters" class="w-full px-4 py-2 border border-[#D4C5B2] rounded-lg text-sm">
                        Sıfırla
                    </button>
                </div>
            </div>

            <!-- Products Grid -->
            <main class="flex-1">
                <!-- Mobile Filter Toggle -->
                <div class="flex items-center justify-between mb-6 lg:hidden">
                    <button id="mobileFilterToggle" class="flex items-center space-x-2 px-4 py-2 bg-white border border-[#D4C5B2] rounded-lg text-sm">
                        <i class="fa-solid fa-filter"></i>
                        <span>Filtrlər</span>
                    </button>
                    <span id="productCount" class="text-sm text-[#5C5548]"></span>
                </div>

                <div class="hidden lg:flex items-center justify-between mb-6">
                    <span id="desktopProductCount" class="text-sm text-[#5C5548]"></span>
                </div>

                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="flex justify-center py-20">
                    <div class="w-10 h-10 border-4 border-[#C9A96E] border-t-transparent rounded-full animate-spin"></div>
                </div>

                <!-- Products Grid -->
                <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Products will be loaded dynamically -->
                </div>

                <!-- Load More Button -->
                <div id="loadMoreContainer" class="flex justify-center mt-8">
                    <button id="loadMoreBtn" class="px-8 py-3 bg-[#1A1814] text-white rounded-lg hover:bg-[#2C2822] transition-all duration-300 transform hover:scale-105">
                        <i class="fa-solid fa-plus mr-2"></i> Daha çox yüklə
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative">
            <button id="closeModal" class="absolute top-4 right-4 z-10 w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <!-- Swiper Image Slider -->
            <div class="swiper productSwiper w-full h-80 md:h-96 bg-[#F5F0E8]">
                <div class="swiper-wrapper" id="modalSwiperWrapper">
                    <!-- Slides will be added dynamically -->
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>

            <!-- Product Info -->
            <div class="p-6">
                <span id="modalCategory" class="text-sm text-[#C9A96E] font-medium uppercase tracking-wider"></span>
                <h2 id="modalProductName" class="text-2xl font-bold text-[#1A1814] mt-2"></h2>
                <p id="modalPrice" class="text-3xl font-bold text-[#C9A96E] mt-3"></p>
                <p id="modalDescription" class="text-gray-600 mt-4 leading-relaxed"></p>
                
                <button id="modalOrderBtn" class="w-full mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-all duration-300 transform hover:scale-105 font-medium">
                    <i class="fa-brands fa-whatsapp mr-2"></i> WhatsApp ilə sifariş et
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-[#1A1814] text-white mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center">
                <h3 class="text-2xl font-bold mb-4" style="font-family: 'Playfair Display', serif;">
                    TURAN <span class="text-[#C9A96E]">LEATHER</span>
                </h3>
                <p class="text-gray-400">Premium əl işi dəri məhsulları</p>
                <div class="mt-4 text-sm text-gray-500">
                    © 2026 Turan Leather. Bütün hüquqlar qorunur.
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
