<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Leather - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="premium.css">
</head>
<body class="bg-[#F5F0E8] font-['Inter']">
    <!-- Admin Header -->
    <header class="bg-[#1A1814] text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <h1 class="text-xl font-bold">Turan Leather <span class="text-[#C9A96E]">| Admin Panel</span></h1>
                <div class="flex items-center space-x-4">
                    <button id="refreshDataBtn" class="px-3 py-1.5 bg-[#2C2822] rounded-lg hover:bg-[#3D3830] transition-colors text-sm">
                        <i class="fa-solid fa-sync-alt mr-1"></i> Yenilə
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tab Navigation -->
        <div class="flex space-x-1 bg-white rounded-lg p-1 mb-8 shadow-sm border">
            <button class="tab-btn active flex-1 py-3 px-4 rounded-md text-sm font-medium transition-all duration-200" data-tab="products">
                <i class="fa-solid fa-box mr-2"></i> Məhsullar
            </button>
            <button class="tab-btn flex-1 py-3 px-4 rounded-md text-sm font-medium transition-all duration-200" data-tab="categories">
                <i class="fa-solid fa-tags mr-2"></i> Kateqoriyalar
            </button>
            <button class="tab-btn flex-1 py-3 px-4 rounded-md text-sm font-medium transition-all duration-200" data-tab="addProduct">
                <i class="fa-solid fa-plus mr-2"></i> Məhsul Əlavə Et
            </button>
        </div>

        <!-- Products List Tab -->
        <div id="productsTab" class="tab-content">
            <div class="bg-white rounded-xl shadow-sm p-6 border">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                    <h2 class="text-xl font-semibold">Məhsulların Siyahısı</h2>
                    <div class="flex items-center space-x-3 w-full sm:w-auto">
                        <input type="text" id="adminSearch" placeholder="Məhsul axtar..." 
                               class="flex-1 sm:flex-none px-4 py-2 border rounded-lg text-sm focus:outline-none focus:border-[#C9A96E]">
                        <select id="adminCategoryFilter" class="px-4 py-2 border rounded-lg text-sm bg-white">
                            <option value="">Bütün kateqoriyalar</option>
                        </select>
                    </div>
                </div>
                
                <div id="adminProductsList" class="space-y-4">
                    <!-- Products will be listed here -->
                </div>
                
                <!-- Pagination -->
                <div id="pagination" class="flex justify-center items-center space-x-2 mt-6">
                    <!-- Pagination buttons will be generated dynamically -->
                </div>
            </div>
        </div>

        <!-- Categories Tab -->
        <div id="categoriesTab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-sm p-6 border">
                <h2 class="text-xl font-semibold mb-6">Kateqoriyaların İdarə Edilməsi</h2>
                
                <!-- Add Category Form -->
                <form id="addCategoryForm" class="flex items-end gap-3 mb-8 pb-6 border-b">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Yeni kateqoriya adı</label>
                        <input type="text" id="newCategoryName" required 
                               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-[#C9A96E]"
                               placeholder="Məsələn: Cüzdan">
                    </div>
                    <button type="submit" class="px-6 py-2 bg-[#1A1814] text-white rounded-lg hover:bg-[#2C2822] transition-colors">
                        <i class="fa-solid fa-plus mr-1"></i> Əlavə et
                    </button>
                </form>

                <!-- Categories List -->
                <div id="categoriesList" class="space-y-3">
                    <!-- Categories will be listed here -->
                </div>
            </div>
        </div>

        <!-- Add/Edit Product Tab -->
        <div id="addProductTab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-sm p-6 border">
                <h2 id="formTitle" class="text-xl font-semibold mb-6">Yeni Məhsul Əlavə Et</h2>
                
                <form id="productForm" class="space-y-5">
                    <input type="hidden" id="productId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Məhsul adı *</label>
                        <input type="text" id="productName" required 
                               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-[#C9A96E]">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Qiymət (AZN) *</label>
                            <input type="number" id="productPrice" step="0.01" min="0" required 
                                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-[#C9A96E]">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kateqoriya *</label>
                            <select id="productCategory" required 
                                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-[#C9A96E] bg-white">
                                <!-- Categories will be loaded dynamically -->
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Təsvir (min. 50 simvol)</label>
                        <textarea id="productDescription" rows="4" minlength="50" 
                                  class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-[#C9A96E]"
                                  placeholder="Məhsul haqqında ətraflı məlumat..."></textarea>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Əsas şəkil *</label>
                            <input type="file" id="mainImage" accept="image/*" 
                                   class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-[#F5F0E8] file:text-[#1A1814] hover:file:bg-[#E8DCC8]">
                            <div id="mainImagePreview" class="mt-2"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Əlavə şəkillər</label>
                            <input type="file" id="additionalImages" accept="image/*" multiple 
                                   class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-[#F5F0E8] file:text-[#1A1814] hover:file:bg-[#E8DCC8]">
                            <div id="additionalImagesPreview" class="mt-2 flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                    
                    <!-- Upload Progress -->
                    <div id="uploadProgress" class="hidden">
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div id="uploadProgressBar" class="bg-[#C9A96E] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="uploadStatus" class="text-sm text-gray-600 mt-1"></p>
                    </div>
                    
                    <div class="flex items-center space-x-3 pt-4">
                        <button type="submit" id="submitBtn" 
                                class="px-6 py-2.5 bg-[#1A1814] text-white rounded-lg hover:bg-[#2C2822] transition-colors font-medium">
                            <i class="fa-solid fa-save mr-1"></i> Yadda saxla
                        </button>
                        <button type="button" id="cancelEditBtn" 
                                class="px-6 py-2.5 border border-[#D4C5B2] text-[#5C5548] rounded-lg hover:bg-gray-50 transition-colors hidden">
                            Ləğv et
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h3 class="text-lg font-semibold mb-3">Silinməni təsdiqləyin</h3>
            <p id="deleteMessage" class="text-gray-600 mb-6">Bu əməliyyat geri qaytarıla bilməz. Davam etmək istədiyinizə əminsiniz?</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelDelete" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">Ləğv et</button>
                <button id="confirmDelete" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Sil</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="px-6 py-3 rounded-lg shadow-lg text-white flex items-center space-x-2" id="toastContent">
            <i id="toastIcon" class="fa-solid fa-check-circle"></i>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
